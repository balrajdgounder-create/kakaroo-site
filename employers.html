<head>
  <meta charset="UTF-8" />
  <title>Kakaroo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
   /* ROOT VARIABLES */
:root {
  --bg: #ffffff;
  --text-main: #111;
  --text-muted: #777;
  --border: #e5e5e5;
  --accent: #000;
  --gold: #d4a64f;
  --gold-light: #f2e4c3;
}

/* GLOBAL RESET */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text-main);
  line-height: 1.6;
}

/* WATERMARK */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("crow.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 60vmin;
  opacity: 0.05;
  pointer-events: none;
  z-index: -1;
}

img {
  max-width: 100%;
  display: block;
}

a {
  text-decoration: none;
  color: inherit;
}

/* PAGE WRAPPER */
.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 20px 64px;
}

/* HEADER */
.site-header {
  background: #fff;
  padding: 12px 20px;
  text-align: left;
}

.wordmark-home {
  height: 90px;
  width: auto;
  display: block;
}

/* ============================
   FULL-WIDTH GOLD HERO
============================ */
.hero {
  width: 100%;
  background: var(--gold-light);
  padding: 60px 20px;
  text-align: center;
  display: flex;
  justify-content: center;
}

.hero-inner {
  max-width: 760px;
  width: 100%;
}

.hero-title {
  font-size: 2.4rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: #222;
}

.hero-subtitle {
  font-size: 1.1rem;
  color: #444;
  margin-bottom: 28px;
  line-height: 1.55;
}

/* SEARCH BAR */
.job-search {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 32px;
}

.job-search input,
.job-search select {
  padding: 12px 14px;
  font-size: 1rem;
  border: 1px solid #bbb;
  border-radius: 6px;
  min-width: 200px;
  background: #fff;
}

.search-btn {
  background: var(--gold);
  color: #000;
  padding: 12px 24px;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}

.search-btn:hover {
  background: #c49745;
}

/* HERO CTAS */
.hero-cta {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 24px;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
}

.btn.primary {
  background: #000;
  color: #fff;
}

.btn.secondary {
  background: #444;
  color: #fff;
}

.btn.tertiary {
  background: var(--gold);
  color: #000;
}

/* ============================
   ABOUT SECTION
============================ */
.section {
  padding: 40px 0;
}

.section-header {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 16px;
}

.about-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr);
  gap: 32px;
  align-items: center;
}

.about-text {
  font-size: 0.98rem;
}

.about-mark {
  border-radius: 20px;
  border: 1px dashed var(--border);
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.6;
}

/* ============================
   SERVICES
============================ */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 12px;
}

.service-card {
  border-radius: 16px;
  border: 1px solid var(--border);
  padding: 18px 18px 20px;
  background: #fff;
  position: relative;
}

.service-pattern {
  position: absolute;
  inset: auto 8px 8px auto;
  width: 56px;
  height: 56px;
  opacity: 0.08;
  background-image:
    radial-gradient(circle at 0 0, #000 2px, transparent 0),
    radial-gradient(circle at 16px 16px, #000 2px, transparent 0);
  background-size: 32px 32px;
  border-radius: 12px;
}

.service-title {
  font-size: 0.98rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.service-body {
  font-size: 0.9rem;
  color: var(--text-muted);
}

/* ============================
   GALLERY
============================ */
.gallery {
  padding: 60px 20px;
  text-align: center;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.gallery-item img {
  width: 100%;
  border-radius: 12px;
  cursor: pointer;
  transition: transform .2s ease;
}

.gallery-item img:hover {
  transform: scale(1.03);
}

/* ============================
   FOOTER
============================ */
footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* ============================
   MOBILE (iPhone 14)
============================ */
@media (max-width: 720px) {
  .about-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .wordmark-home {
    height: 38px;
  }

  .hero {
    padding: 40px 16px;
  }

  .hero-title {
    font-size: 1.9rem;
  }

  .hero-subtitle {
    font-size: 1rem;
  }

  .job-search {
    flex-direction: column;
    gap: 10px;
  }

  .job-search input,
  .job-search select,
  .search-btn {
    width: 100%;
  }

  .hero-cta {
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    width: 100%;
    text-align: center;
  }
}
  </style>
</head>

<!-- SUBPAGE HEADER -->
<header class="site-header sub-header">
     <a href="index.html">
  <img src="images/look2.jpg" alt="KAKAROO" class="wordmark-home">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </a>
</header>

<!-- HERO SECTION -->
<section class="hero">
    <div class="hero-inner">

  <h1 class="page-title">Employers</h1>
  <p class="page-subtitle">Specialised IT & tech recruitment for growing teams.</p>

          <!-- PRIMARY CTAS -->
        <div class="hero-cta">
            <a href="employers.html" class="btn primary">Hire Talent</a>
            <a href="jobs.html" class="btn secondary">Find Jobs</a>
            <a href="goodies.html" class="btn tertiary">Goodies</a>
        </div>

    </div>
</section>
